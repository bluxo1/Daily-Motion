name: Verify foundation
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  api:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17.7
        env:
          POSTGRES_USER: dm_admin
          POSTGRES_PASSWORD: synthetic-ci-only
          POSTGRES_DB: daily_motion_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U dm_admin -d daily_motion_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DM_TEST_ADMIN_URL: postgresql+psycopg://dm_admin:synthetic-ci-only@127.0.0.1:5432/daily_motion_test
      DM_RUN_CONNECTED: "1"
      DM_RUN_RECOVERY: "1"
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: "3.47.7"
          channel: stable
          cache: true
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.0"
          python-version: "3.13.14"
      - run: uv sync --frozen --extra dev
      - run: uv run --no-sync python ../../tools/check_secrets.py
      - run: flutter pub get --enforce-lockfile
        working-directory: apps/mobile
      - run: uv run --no-sync ruff format --check . ../../tools
      - run: uv run --no-sync ruff check . ../../tools
      - run: uv run --no-sync mypy --strict src scripts
      - run: docker image inspect postgres:17.7 --format '{{.Id}}'
      - run: uv run --no-sync pytest -q --junitxml=../../.tools/python-ci.xml
      - run: uv run --no-sync python ../../tools/check_python_results.py ../../.tools/python-ci.xml
      - run: uv run --no-sync python -m unittest discover -s ../../tools/tests -p test_python_results.py
      - run: uv run --no-sync python scripts/export_openapi.py
      - run: git diff --exit-code -- ../../contracts/openapi.json
      - run: uv run --no-sync python ../../tools/generate_transport.py
      - run: dart format lib/sync/transport_contract.dart lib/sync/transport_limits.dart
        working-directory: apps/mobile
      - run: git diff --exit-code -- ../../apps/mobile/lib/sync/transport_contract.dart ../../apps/mobile/lib/sync/transport_limits.dart
      - run: uv run --no-sync python ../../tools/check_docs.py
      - run: uv run --no-sync python ../../tools/check_native_config.py
      - run: uv run --no-sync python ../../tools/check_mobile_qualification.py
      - run: uv run --no-sync python -m unittest discover -s ../../tools/tests -p test_mobile_qualification.py
  mobile:
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-15-intel]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: runner.os == 'Linux'
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
      - if: runner.os == 'macOS'
        run: sudo xcode-select --switch /Applications/Xcode_26.3.app
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: "3.47.7"
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: dart run build_runner build
      - run: git diff --exit-code -- lib/data/database.g.dart
      - run: dart format --output=none --set-exit-if-changed lib test integration_test test_driver
      - run: flutter analyze
      - run: flutter test
      - if: runner.os == 'Linux'
        run: flutter build apk --debug
      - if: runner.os == 'Linux'
        run: flutter build apk --profile
      - if: runner.os == 'Linux'
        run: flutter build apk --release
      - if: runner.os == 'Linux'
        run: flutter build apk --debug -t lib/qualification/routine_prototype.dart
      - if: runner.os == 'macOS'
        run: flutter build ios --debug --no-codesign
      - if: runner.os == 'macOS'
        run: flutter build ios --release --no-codesign
      - if: runner.os == 'Linux'
        run: flutter build apk --debug -t integration_test/native_storage_test.dart
        env:
          DM_QUALIFICATION_BUILD: "1"
      - if: runner.os == 'Linux'
        run: flutter build apk --profile -t integration_test/durable_save_benchmark_test.dart --dart-define=DM_BUILD_REVISION=${{ github.sha }}
        env:
          DM_QUALIFICATION_BUILD: "1"
      - if: runner.os == 'macOS'
        run: flutter build ios --debug --no-codesign -t integration_test/native_storage_test.dart
